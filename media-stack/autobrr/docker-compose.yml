services:
  autobrr:
    container_name: autobrr
    image: ghcr.io/autobrr/autobrr:latest
    restart: unless-stopped
    #logging:
    #  driver: json-file
    #  options:
    #    max-file: ${DOCKERLOGGING_MAXFILE}
    #    max-size: ${DOCKERLOGGING_MAXSIZE}
    user: 1000:1000
    environment:
      - TZ=Europe/Berlin
    volumes:
      - /home/cloudcrusader/mediastack/autobrr/config:/config
      - /:/raspi-root/
    ports:
      - 7474:7474