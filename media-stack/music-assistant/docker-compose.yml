
# [Music-Assistant](https://www.music-assistant.io/)  
# Original Project / Tutorial: https://thijstakken.github.io/MusicService/docker-compose.yml
# Self-Hosted with <3. Currently it runs on Raspberry Pi 5 /w Raspbian + Docker
services:
  music-assistant-server:
    image: ghcr.io/music-assistant/server:latest # <<< Desired release version here (or use beta to get the latest beta version)
    container_name: music-assistant-server
    restart: unless-stopped
    # Network mode must be set to host for MA to work correctly
    network_mode: host
    volumes:
      - /home/cloudcrusader/mediastack/music-assistant-server/data:/data/
      - /:/raspi-root/
      - /media/cloudcrusader/PortableSSD:/mnt/PortableSSD/
      - /media/cloudcrusader/ExtremeSSD:/mnt/ExtremeSSD/
    # privileged caps (and security-opt) needed to mount smb folders within the container
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opt:
      - apparmor:unconfined
    environment:
      # Provide logging level as environment variable.
      # default=info, possible=(critical, error, warning, info, debug)
      - LOG_LEVEL=info